[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iqoption-client"
version = "1.0.0"
description = "Async IQ Option WebSocket client"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=13.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/IzioGanasi/iqoption-client"
Repository = "https://github.com/IzioGanasi/iqoption-client"

[tool.setuptools.packages.find]
where = ["src"]
